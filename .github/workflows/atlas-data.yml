# Probable Atlas: refresh the data (economics: World Bank, IMF, FRED; markets: Yahoo Finance, FRED, Shiller, French) and redeploy.
# Data lives on the single-commit "atlas-data" branch (force-pushed each run) so main's history stays small.
name: Probable Atlas data refresh

on:
  schedule:
    # GitHub runs schedules best-effort and drops some at busy times, so each slot has a backup
    - cron: "23 11 * * 1-5"          # weekday mornings, after most US releases (8:30 ET)
    - cron: "53 12 * * 1-5"          # morning backup
    - cron: "23 22 * * *"            # evenings, after markets close
    - cron: "51 23 * * *"            # evening backup
    - cron: "47 14,16,18,20 * * 1-5" # during US trading hours: markets only
    - cron: "17 15,17,19 * * 1-5"    # more trading-hours runs: markets only
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["probable-atlas/pipeline/**", ".github/workflows/atlas-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    concurrency:
      group: "atlas-data"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTRADAY: ${{ github.event.schedule == '47 14,16,18,20 * * 1-5' || github.event.schedule == '17 15,17,19 * * 1-5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install --quiet --upgrade yfinance xlrd || pip install --quiet xlrd || true
      - name: Load previous data (kept if a source fails)
        run: |
          mkdir -p prev out
          if git fetch --depth=1 origin atlas-data; then git archive FETCH_HEAD | tar -x -C prev; fi
          ls -la prev
      - name: Fetch economics (World Bank, IMF, FRED)
        if: env.INTRADAY != 'true'
        env:
          OUT_DIR: out
          PREV_DIR: prev
        run: python probable-atlas/pipeline/fetch_econ.py
      - name: Keep economics data (intraday run)
        if: env.INTRADAY == 'true'
        run: cp prev/world.json prev/us.json prev/status.json out/ 2>/dev/null || true
      - name: Fetch markets (Yahoo Finance, FRED, Shiller, French)
        env:
          OUT_DIR: out
          PREV_DIR: prev
        run: python probable-atlas/pipeline/fetch_markets.py || (echo "markets fetch failed; keeping previous files" && cp prev/markets*.json prev/mstatus.json out/ 2>/dev/null || true)
      - name: Save to atlas-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b atlas-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Probable Atlas data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" atlas-data
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
