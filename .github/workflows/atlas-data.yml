# Probable Atlas: refresh the economics data (World Bank, IMF, FRED) and redeploy the site.
# Data lives on the single-commit "atlas-data" branch (force-pushed each run) so main's history stays small.
name: Probable Atlas data refresh

on:
  schedule:
    - cron: "23 11 * * 1-5"   # weekday mornings, after most US releases (8:30 ET)
    - cron: "23 22 * * *"     # evenings, after markets close
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["probable-atlas/pipeline/**", ".github/workflows/atlas-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load previous data (kept if a source fails)
        run: |
          mkdir -p prev
          if git fetch --depth=1 origin atlas-data; then git archive FETCH_HEAD | tar -x -C prev; fi
          ls -la prev
      - name: Fetch sources
        env:
          OUT_DIR: out
          PREV_DIR: prev
        run: python probable-atlas/pipeline/fetch_econ.py
      - name: Save to atlas-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b atlas-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Probable Atlas data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" atlas-data
      - name: Assemble site
        run: |
          mkdir -p probable-atlas/data
          cp out/*.json probable-atlas/data/
          rm -rf out prev
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
