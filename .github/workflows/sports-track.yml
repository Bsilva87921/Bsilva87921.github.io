# Probable Sports Lab: grade the lab's predictions (track record) and log what the live board shows before each game.
# Keeps its archive on the single-commit "sports-data" branch and redeploys the site with both data sets.
name: Sports Lab track record

on:
  schedule:
    - cron: "11,41 * * * *"          # twice an hour (GitHub drops some scheduled runs): log pregame numbers, grade finished games
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["live-sports-lab/pipeline/**", "live-sports-lab/source/src/0*.js", ".github/workflows/sports-track.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track:
    concurrency:
      group: "sports-track"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Load previous archive and log
        run: |
          mkdir -p prev out
          if git fetch --depth=1 origin sports-data; then git archive FETCH_HEAD | tar -x -C prev; fi
          ls -la prev || true
      - name: Grade and log
        env:
          OUT_DIR: out
          PREV_DIR: prev
        run: node live-sports-lab/pipeline/track.mjs || (echo "track run failed; keeping previous files" && cp -r prev/. out/)
      - name: Save to sports-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b sports-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sports Lab track record $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sports-data
  deploy:
    needs: track
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
