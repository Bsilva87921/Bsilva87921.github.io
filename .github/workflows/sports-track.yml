# Probable Sports Lab: grade the lab's predictions (track record) and log what the live board shows before each game.
# Keeps its archive on the single-commit "sports-data" branch and redeploys the site with both data sets.
name: Sports Lab track record

on:
  schedule:
    - cron: "11 * * * *"             # hourly: log pregame numbers close to start, grade finished games
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["live-sports-lab/pipeline/**", "live-sports-lab/source/src/0*.js", ".github/workflows/sports-track.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  track:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Load previous archive and log
        run: |
          mkdir -p prev out
          if git fetch --depth=1 origin sports-data; then git archive FETCH_HEAD | tar -x -C prev; fi
          ls -la prev || true
      - name: Grade and log
        env:
          OUT_DIR: out
          PREV_DIR: prev
        run: node live-sports-lab/pipeline/track.mjs || (echo "track run failed; keeping previous files" && cp -r prev/. out/)
      - name: Save to sports-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b sports-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sports Lab track record $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sports-data
      - name: Assemble site
        run: |
          mkdir -p live-sports-lab/data probable-atlas/data
          cp out/track.json live-sports-lab/data/ 2>/dev/null || true
          if git fetch --depth=1 origin atlas-data; then git archive FETCH_HEAD | tar -x -C probable-atlas/data; fi
          rm -rf out prev
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
