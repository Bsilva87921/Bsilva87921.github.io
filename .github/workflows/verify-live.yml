# Temporary: checks the live Probable sites in real browsers (Linux Chromium and macOS Chrome) and keeps screenshots.
name: Verify live sites (temporary)
on:
  push:
    branches: ["verify-live"]
permissions:
  contents: write
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          if [ "${{ matrix.name }}" = "linux" ]; then npx playwright install --with-deps chromium; fi
      - name: Check the live sites
        env:
          OG_ONLY: "0"
          WAIT_FOR: "probable-3d.js?v=3"
        run: node verify/check.mjs ${{ matrix.name }}
      - name: Keep the results on this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f verify/out-${{ matrix.name }} && git commit -qm "Live check results (${{ matrix.name }})" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin verify-live && git push -q origin HEAD:verify-live && break; sleep 5; done
