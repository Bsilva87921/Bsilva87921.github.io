# Probable news: headlines for the Atlas (economics and markets) and the Sports Lab from public feeds, every half
# hour. Saved on the single-commit "news-data" branch, then the site is redeployed with them.
name: Probable news

on:
  schedule:
    - cron: "4,34 * * * *"           # twice an hour (GitHub drops some scheduled runs)
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["probable-atlas/pipeline/fetch_news.py", ".github/workflows/news.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: "news"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the previous headlines (kept if a feed fails)
        run: |
          mkdir -p prev out
          if git fetch --depth=1 origin news-data; then git archive FETCH_HEAD | tar -x -C prev; fi
      - name: Fetch headlines
        env:
          OUT_DIR: out
          PREV_DIR: prev
        run: python probable-atlas/pipeline/fetch_news.py || (echo "news fetch failed; keeping previous files" && cp prev/*.json out/ 2>/dev/null || true)
      - name: Save to news-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          ls -la
          if [ -z "$(ls -A)" ]; then echo "no headline files yet; nothing to save"; exit 0; fi
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Probable news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
  deploy:
    needs: news
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
