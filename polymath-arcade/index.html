}

/* =====================================================================
   3D tile emblems (one CSS 3D scene per game)
   ===================================================================== */
.emb{position:absolute;top:30px;right:10px;width:72px;height:72px;transform-style:preserve-3d;transform:translateZ(30px) scale(var(--es,1));transition:transform .7s cubic-bezier(.2,1.3,.35,1);pointer-events:none;color:var(--dc);
  --hi:color-mix(in oklab,var(--dc) 45%,#fff);--lo:color-mix(in oklab,var(--dc) 62%,#000);--glow:color-mix(in oklab,var(--dc) 55%,transparent);--paper:color-mix(in oklab,var(--dc) 9%,var(--surface))}
.emb i{position:absolute;display:block;box-sizing:border-box;transform-style:preserve-3d;font-style:normal}
.emb b,.emb small,.emb s{font-style:normal}
.tile:hover .emb,.tile:focus-visible .emb{transform:translateZ(56px) scale(calc(var(--es,1) * 1.12))}
.tile:not(.live) .emb,.tile:not(.live) .emb *,body.in-game .emb,body.in-game .emb *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.emb,.emb *{animation:none!important;transition:none!important}}
@media (max-width:520px){.emb{--es:.84;top:24px;right:2px}}

/* Memory Matrix: cards flip in sequence */
.emb-memory .mm-grid{inset:0;transform:rotateX(22deg) rotateY(-24deg);transition:transform .6s}
.tile:hover .emb-memory .mm-grid{transform:rotateX(8deg) rotateY(-6deg)}
.emb-memory .mm-c{left:var(--x);top:var(--y);width:26px;height:26px;animation:mmFlip 5.2s cubic-bezier(.65,0,.3,1) infinite var(--d)}
.emb-memory .mm-c i{inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.emb-memory .f{background:linear-gradient(140deg,var(--hi),var(--dc) 60%,var(--lo));box-shadow:0 0 14px -3px var(--dc),inset 0 0 0 1px rgba(255,255,255,.35)}
.emb-memory .f::after{content:"";position:absolute;inset:6px;border-radius:3px;border:1.5px dashed rgba(255,255,255,.6)}
.emb-memory .k{transform:rotateY(180deg);display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--dc);color:var(--dc);font:800 13px/1 var(--font-display);box-shadow:0 0 16px -4px var(--dc)}
@keyframes mmFlip{0%,24%{transform:translateZ(0) rotateY(0)}36%,64%{transform:translateZ(9px) rotateY(180deg)}76%,100%{transform:translateZ(0) rotateY(360deg)}}

/* Color Clash: a Stroop cube */
.emb-clash .cc-shadow{left:16px;top:60px;width:40px;height:9px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);animation:ccShadow 4.5s ease-in-out infinite}
.emb-clash .cc-cube{left:19px;top:13px;width:34px;height:34px;animation:ccSpin 9s linear infinite}
.emb-clash .cc-f{inset:0;display:grid;place-items:center;border-radius:6px;transform:var(--t) translateZ(17px);background:linear-gradient(150deg,color-mix(in oklab,var(--fc) 28%,var(--surface)),color-mix(in oklab,var(--fc) 10%,var(--surface)));border:1.5px solid var(--fc);box-shadow:inset 0 0 10px rgba(255,255,255,.2),0 0 12px -4px var(--fc)}
.emb-clash .cc-f b{font:800 7.5px/1 var(--font-display);letter-spacing:.02em;color:var(--wc)}
@keyframes ccSpin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
@keyframes ccShadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}

/* Pattern Pro: a wave of rising blocks */
.emb-pattern .pp-plane{left:13px;top:15px;width:46px;height:46px;transform:rotateX(56deg) rotateZ(-45deg)}
.emb-pattern .pp-plane::before{content:"";position:absolute;inset:-4px;border-radius:8px;background:color-mix(in oklab,var(--dc) 14%,transparent);border:1px solid color-mix(in oklab,var(--dc) 35%,transparent)}
.emb-pattern .pp-b{left:var(--x);top:var(--y);width:12px;height:12px;animation:ppRise 2.8s cubic-bezier(.5,0,.3,1) infinite var(--d)}
.emb-pattern .pp-b.alt{--dc:#f472b6;--hi:#fbcfe8;--lo:#9d174d}
.emb-pattern .pp-b::before{content:"";position:absolute;inset:0;border-radius:2px;background:linear-gradient(135deg,var(--hi),var(--dc));transform:translateZ(7px);box-shadow:0 0 10px -2px var(--dc)}
.emb-pattern .pp-b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--dc);transform-origin:50% 100%;transform:rotateX(-90deg)}
.emb-pattern .pp-b .w{left:0;top:0;bottom:0;width:7px;background:var(--lo);transform-origin:0 50%;transform:rotateY(-90deg)}
@keyframes ppRise{0%,56%,100%{transform:translateZ(0)}22%{transform:translateZ(15px)}}

/* Math Sprint: split-flap digits and an operator coin */
.emb-sprint .sf-row{left:9px;top:24px;width:54px;height:36px;display:flex;gap:4px;transform:rotateX(14deg) rotateY(-20deg)}
.emb-sprint .sf{position:relative;flex:1;height:36px;border-radius:5px;box-shadow:0 8px 16px -8px var(--dc),0 0 0 1px color-mix(in oklab,var(--dc) 50%,transparent)}
.emb-sprint .sf i{left:0;right:0;height:50%;overflow:hidden;background:linear-gradient(180deg,#262b4d,#161a33);border-radius:5px 5px 0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.emb-sprint .sf .u,.emb-sprint .sf .fu{top:0}
.emb-sprint .sf .l,.emb-sprint .sf .fl{top:50%;border-radius:0 0 5px 5px;background:linear-gradient(180deg,#141830,#1f2444)}
.emb-sprint .sf b{display:block;height:36px;font:800 24px/36px var(--font-display);color:#fff;text-align:center;text-shadow:0 0 12px var(--dc)}
.emb-sprint .sf .l b,.emb-sprint .sf .fl b{margin-top:-18px}
.emb-sprint .sf .fu{transform-origin:50% 100%;transform:rotateX(-90deg)}
.emb-sprint .sf .fl{transform-origin:50% 0;transform:rotateX(90deg)}
.emb-sprint .sf.go .fu{animation:sfTop .32s ease-in both}
.emb-sprint .sf.go .fl{animation:sfBot .32s ease-out .3s both}
.emb-sprint .sf::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;margin-top:-.5px;background:rgba(0,0,0,.65);transform:translateZ(.5px)}
@keyframes sfTop{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes sfBot{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.emb-sprint .sf-op{left:0;top:2px;width:21px;height:21px;animation:sfOp 4s linear infinite}
.emb-sprint .sf-op i{inset:0;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--font-display);color:#fff;background:radial-gradient(circle at 35% 30%,var(--hi),var(--dc) 60%,var(--lo));box-shadow:0 0 12px -2px var(--dc);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.emb-sprint .sf-op .o2{transform:rotateY(180deg)}
@keyframes sfOp{from{transform:translateZ(18px) rotateY(0)}to{transform:translateZ(18px) rotateY(360deg)}}

/* Target Number: dart into a 3D target */
.emb-target .tg-board{left:12px;top:6px;width:48px;height:48px;transform:rotateY(-28deg) rotateX(8deg);animation:tgHit 2.8s ease-out infinite}
.emb-target .r{border-radius:50%}
.emb-target .r1{inset:0;background:radial-gradient(circle,var(--paper) 0 30%,var(--dc) 31% 44%,var(--paper) 45% 62%,var(--dc) 63% 78%,var(--paper) 79%);border:2px solid var(--dc);box-shadow:0 0 18px -6px var(--dc)}
.emb-target .r2{inset:12px;border:2px solid var(--hi);transform:translateZ(3px)}
.emb-target .r3{inset:19px;background:radial-gradient(circle at 40% 35%,#fff,var(--dc));transform:translateZ(6px);box-shadow:0 0 10px var(--dc)}
.emb-target .tg-dart{left:36px;top:24px;width:40px;height:12px;transform-origin:0 50%;color:var(--hi);animation:tgFly 2.8s cubic-bezier(.25,.8,.3,1) infinite;transform:rotate(-26deg) translate3d(0,0,9px)}
.emb-target .tg-dart svg{display:block;width:40px;height:12px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
@keyframes tgFly{0%{transform:rotate(-26deg) translate3d(52px,0,34px);opacity:0}8%{opacity:1}26%{transform:rotate(-26deg) translate3d(0,0,9px)}31%{transform:rotate(-31deg) translate3d(0,0,9px)}36%{transform:rotate(-22deg) translate3d(0,0,9px)}40%,80%{transform:rotate(-26deg) translate3d(0,0,9px);opacity:1}92%,100%{transform:rotate(-26deg) translate3d(0,0,9px);opacity:0}}
@keyframes tgHit{0%,25%{transform:rotateY(-28deg) rotateX(8deg)}29%{transform:rotateY(-35deg) rotateX(11deg) translateZ(-3px)}36%,100%{transform:rotateY(-28deg) rotateX(8deg)}}

/* Planet Launch: ringed planet with an orbiting moon */

.emb-launch .pl-stars i:nth-child(2){left:64px;top:14px;animation-delay:.8s}

@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.emb-launch .pl-grp{inset:0;transform:rotateZ(-18deg)}
.emb-launch .pl-planet{left:21px;top:21px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 3%,var(--hi) 14%,var(--dc) 48%,var(--lo) 100%);box-shadow:0 0 22px -4px var(--dc),inset -5px -4px 9px rgba(0,0,0,.3)}
.emb-launch .pl-ring{left:7px;top:7px;width:58px;height:58px;border-radius:50%;border:3px solid color-mix(in oklab,var(--hi) 80%,transparent);box-shadow:0 0 10px -2px var(--dc);transform:rotateX(74deg)}

@keyframes plOrbit{to{transform:rotateZ(360deg)}}
@keyframes plCounter{from{transform:rotateZ(0) rotateX(-74deg)}to{transform:rotateZ(-360deg) rotateX(-74deg)}}

/* Formula Frenzy: atom */
.emb-formula .at-grp{inset:0;animation:atSway 8s ease-in-out infinite;transform:rotateY(-20deg) rotateX(8deg)}
.emb-formula .at-nuc{left:29px;top:29px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--hi) 35%,var(--dc));box-shadow:0 0 16px var(--dc);animation:atPulse 1.8s ease-in-out infinite}
.emb-formula .at-o{left:5px;top:5px;width:62px;height:62px;transform:rotateZ(var(--r)) rotateX(72deg)}
.emb-formula .at-p{inset:0;border-radius:50%;border:1.6px solid color-mix(in oklab,var(--dc) 75%,transparent);animation:atSpin var(--t) linear infinite}
.emb-formula .at-e{left:25.9px;top:-4.3px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--hi));box-shadow:0 0 8px 1px var(--dc);animation:atCounter var(--t) linear infinite}
@keyframes atSpin{to{transform:rotateZ(360deg)}}
@keyframes atCounter{from{transform:rotateZ(0deg) rotateX(-72deg) rotateZ(calc(-1 * var(--r)))}to{transform:rotateZ(-360deg) rotateX(-72deg) rotateZ(calc(-1 * var(--r)))}}
@keyframes atSway{0%,100%{transform:rotateY(-24deg) rotateX(8deg)}50%{transform:rotateY(24deg) rotateX(-6deg)}}
@keyframes atPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* Estimation Station: gauge with a springy needle */
.emb-estimate .es-dial{left:4px;top:6px;width:64px;height:46px;transform:rotateX(16deg) rotateY(-16deg)}
.emb-estimate .es-face{inset:0;border-radius:32px 32px 10px 10px;background:linear-gradient(180deg,var(--paper),color-mix(in oklab,var(--dc) 4%,var(--surface)));border:1px solid color-mix(in oklab,var(--dc) 40%,transparent);box-shadow:0 10px 20px -12px var(--dc)}
.emb-estimate .es-face svg{position:absolute;left:-1px;top:5px;width:64px;height:38px}
.emb-estimate .es-needle{left:30.75px;top:16px;width:2.5px;height:24px;border-radius:2px;background:linear-gradient(#f472b6,#f97316);transform-origin:50% 100%;transform:translateZ(3px) rotate(var(--a,24deg));transition:transform 1.2s cubic-bezier(.3,1.65,.4,1);box-shadow:0 0 6px rgba(244,114,182,.6)}
.emb-estimate .es-hub{left:28px;top:36px;width:8px;height:8px;border-radius:50%;background:var(--ink);transform:translateZ(5px);box-shadow:0 0 0 2px var(--surface)}
.emb-estimate .es-read{position:absolute;left:0;right:0;top:56px;text-align:center;font:700 10px/1 var(--font-mono);color:var(--ink);transform:translateZ(10px)}

.emb-shopper .sh-pend{left:20px;top:0;width:32px;height:62px;transform-origin:50% 0;animation:shSwing 3.4s ease-in-out infinite alternate}

.emb-shopper .sh-face{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-bottom:7px;clip-path:polygon(50% 0,100% 20%,100% 100%,0 100%,0 20%);background:linear-gradient(160deg,#fef3c7,#fbbf24 70%,#f59e0b);color:#3b2300;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.emb-shopper .sh-b{transform:rotateY(180deg);background:linear-gradient(160deg,#fbcfe8,#ec4899 70%,#be185d);color:#fff}
.emb-shopper .hole{left:12.5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}

@keyframes shSwing{from{transform:rotateZ(-9deg)}to{transform:rotateZ(9deg)}}
@keyframes shTurn{0%,32%{transform:rotateY(0)}50%,82%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}

/* Globe Trotter: wireframe globe and a bouncing pin */
.emb-globe .gl-glow{left:6px;top:6px;width:60px;height:60px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);opacity:.7}
.emb-globe .gl-ax{left:11px;top:11px;width:50px;height:50px;transform:rotateZ(20deg) rotateX(-12deg)}
.emb-globe .gl-spin{inset:0;animation:glSpin 10s linear infinite}
.emb-globe .gl-m{inset:0;border-radius:50%;border:1.3px solid color-mix(in oklab,var(--dc) 72%,transparent);transform:rotateY(var(--r))}
.emb-globe .gl-p{left:calc(50% - var(--s) / 2);top:calc(50% - var(--s) / 2);width:var(--s);height:var(--s);border-radius:50%;border:1.3px solid color-mix(in oklab,var(--dc) 55%,transparent);transform:translateY(var(--y)) rotateX(90deg)}
.emb-globe .gl-dot{left:23px;top:23px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px var(--dc);transform:rotateY(var(--lon)) rotateX(var(--lat)) translateZ(25px);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.emb-globe .gl-pin{left:47px;top:-3px;width:14px;height:14px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#fb7185,#e11d48);transform:translateZ(28px) rotate(-45deg);box-shadow:0 4px 10px -2px rgba(225,29,72,.6);animation:glPin 1.8s ease-in-out infinite}
.emb-globe .gl-pin::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:#fff}
@keyframes glSpin{to{transform:rotateY(360deg)}}
@keyframes glPin{0%,100%{transform:translateZ(28px) translateY(0) rotate(-45deg)}50%{transform:translateZ(28px) translateY(-5px) rotate(-45deg)}}

/* Robot Coder: cube robot hopping round a tiny board */
.emb-robot .rb-board{left:12px;top:14px;width:46px;height:46px;transform:rotateX(56deg) rotateZ(-45deg)}
.emb-robot .rb-t{left:var(--x);top:var(--y);width:14px;height:14px;border-radius:3px;background:linear-gradient(135deg,color-mix(in oklab,var(--dc) 32%,var(--surface)),color-mix(in oklab,var(--dc) 14%,var(--surface)));border:1px solid color-mix(in oklab,var(--dc) 45%,transparent);box-shadow:0 3px 0 color-mix(in oklab,var(--dc) 45%,#000)}
.emb-robot .rb-gem{left:16px;top:16px;width:14px;height:14px;transform:rotateZ(45deg) rotateX(-56deg) translateY(-8px);animation:rbGem 2s ease-in-out infinite}
.emb-robot .rb-gem::before{content:"";position:absolute;left:3px;top:3px;width:8px;height:8px;transform:rotate(45deg);background:linear-gradient(135deg,#a5f3fc,#22d3ee 50%,#0e7490);box-shadow:0 0 10px #22d3ee}

.emb-robot .rb-bot .eye{left:4px;top:4px;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff}
.emb-robot .rb-bot .s{left:0;right:0;bottom:0;height:11px;background:var(--dc);transform-origin:50% 100%;transform:rotateX(-90deg)}
.emb-robot .rb-bot .s::before{content:"";position:absolute;left:2px;top:3px;width:2.5px;height:2.5px;border-radius:50%;background:#fff;box-shadow:4.5px 0 0 #fff}
.emb-robot .rb-bot .w{left:0;top:0;bottom:0;width:11px;background:var(--lo);transform-origin:0 50%;transform:rotateY(-90deg)}
@keyframes rbWalk{0%{transform:translate3d(0,0,0)}4%{transform:translate3d(8px,0,7px)}8%,12.5%{transform:translate3d(16px,0,0)}16.5%{transform:translate3d(24px,0,7px)}20.5%,25%{transform:translate3d(32px,0,0)}29%{transform:translate3d(32px,8px,7px)}33%,37.5%{transform:translate3d(32px,16px,0)}41.5%{transform:translate3d(32px,24px,7px)}45.5%,50%{transform:translate3d(32px,32px,0)}54%{transform:translate3d(24px,32px,7px)}58%,62.5%{transform:translate3d(16px,32px,0)}66.5%{transform:translate3d(8px,32px,7px)}70.5%,75%{transform:translate3d(0,32px,0)}79%{transform:translate3d(0,24px,7px)}83%,87.5%{transform:translate3d(0,16px,0)}91.5%{transform:translate3d(0,8px,7px)}95.5%,100%{transform:translate3d(0,0,0)}}

/* Code Tracer: stacked editor panes, a tracing caret and the output */
.emb-tracer .ct-grp{inset:0;transform:rotateY(-26deg) rotateX(10deg)}
.emb-tracer .ct-pane{left:6px;top:14px;width:52px;height:46px;border-radius:8px;background:color-mix(in oklab,var(--surface) 90%,transparent);border:1px solid color-mix(in oklab,var(--dc) 40%,transparent);box-shadow:0 10px 22px -12px var(--dc)}
.emb-tracer .p2{transform:translate3d(7px,-7px,-12px);opacity:.7}
.emb-tracer .p3{transform:translate3d(14px,-14px,-24px);opacity:.45}
.emb-tracer .ct-dots{left:6px;top:5px;display:flex;gap:2.5px}
.emb-tracer .ct-dots i{position:relative;width:4px;height:4px;border-radius:50%;background:#f87171}
.emb-tracer .ct-dots i:nth-child(2){background:#fbbf24}
.emb-tracer .ct-dots i:nth-child(3){background:#4ade80}
.emb-tracer .ln{left:calc(7px + var(--ind));top:calc(14px + var(--row) * 6px);height:3px;width:calc(var(--w) - var(--ind));border-radius:2px;background:var(--c);opacity:.85}

/* =====================================================================

   ===================================================================== */
.tour{position:fixed;inset:0;z-index:65;pointer-events:none}

.tour-spot{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 200vmax transparent;transition:left .55s cubic-bezier(.3,1.15,.4,1),top .55s cubic-bezier(.3,1.15,.4,1),width .55s cubic-bezier(.3,1.15,.4,1),height .55s cubic-bezier(.3,1.15,.4,1),border-radius .55s,box-shadow .4s}

  transition:left .5s cubic-bezier(.3,1.15,.4,1),top .5s cubic-bezier(.3,1.15,.4,1),width .4s,opacity .35s,transform .45s cubic-bezier(.3,1.3,.4,1)}

.tc-in{position:relative;padding:18px 18px 16px;border-radius:24px;background:var(--sheet);border:1px solid var(--glass-brd);transform-origin:50% 50%;
  box-shadow:var(--shadow-lg),0 0 0 1px color-mix(in oklab,var(--accent) 22%,transparent),0 30px 80px -30px rgba(124,58,237,.65);
  transition:transform .44s cubic-bezier(.3,1.35,.4,1),opacity .3s}
.tc-in::before{content:"";position:absolute;inset:0 18px auto;height:2px;border-radius:2px;background:var(--grad);background-size:200% 100%;animation:sheen 6s linear infinite}
.tour-card.out-l .tc-in{transform:rotateY(-74deg) translateZ(-40px);opacity:0;transition-duration:.2s;transition-timing-function:ease-in}
.tour-card.out-r .tc-in{transform:rotateY(74deg) translateZ(-40px);opacity:0;transition-duration:.2s;transition-timing-function:ease-in}

.tc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.cube.mini{width:22px;height:22px;animation:none;transition:transform .8s cubic-bezier(.3,1.4,.4,1)}

.cube.mini i:nth-child(1){transform:translateZ(11px)}

.tc-step{font:700 10.5px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

<script>
'use strict';
/* =====================================================================
   Polymath Arcade: core (utilities, state, sound, shell, game host, quiz engine)
   ===================================================================== */

/* ---------- Utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const money = (n, d = 0) => (n < 0 ? '−$' : '$') + fmt(Math.abs(n), d);
const pct = (n, d = 0) => fmt(n * 100, d) + '%';
const fmtK = n => Math.abs(n) >= 10000 ? fmt(n / 1000, 0) + 'k' : Math.abs(n) >= 1000 ? fmt(n / 1000, 1) + 'k' : fmt(n);
const stripTags = s => String(s).replace(/<[^>]+>/g, '');
const round2 = x => Math.round(x * 100) / 100;
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; }
function dayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); }
const prettyDate = (d = new Date()) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const fmtClock = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Random numbers (seedable, so the Daily Challenge is the same for everyone) ---------- */
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

    float: (lo, hi) => lo + next() * (hi - lo),
    pick: arr => arr[Math.floor(next() * arr.length)],
    chance: p => next() < p,
    shuffle: arr => { const x = arr.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; },
    sample: (arr, n) => r.shuffle(arr).slice(0, n),
    normal: (mu = 0, sd = 1) => { let u = 0; while (u === 0) u = next(); const v = next(); return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
    weighted: items => { const tot = items.reduce((s, x) => s + x[1], 0); let k = next() * tot; for (const [it, w] of items) { k -= w; if (k < 0) return it; } return items[items.length - 1][0]; }
  };

const RNG = makeRng(((Math.random() * 4294967296) >>> 0) ^ (Date.now() & 0xffffffff));

/* Three plausible wrong numbers near `ans` (meaningful mistakes first). */
function nearNums(ans, r, extras = [], opt = {}) {
  const allowNeg = opt.neg || ans < 0;
  const dec = opt.dec || 0;
  const norm = v => dec ? Math.round(v * 10 ** dec) / 10 ** dec : Math.round(v);
  const ok = v => Number.isFinite(v) && (allowNeg || v >= 0) && norm(v) !== norm(ans);
  const out = [];
  const add = v => { v = norm(v); if (ok(v) && !out.includes(v)) out.push(v); };
  extras.forEach(add);
  const mag = Math.abs(ans);
  const step = dec ? Math.max(10 ** -dec, round2(mag * 0.1)) : Math.max(1, Math.round(mag * 0.1));
  const pool = r.shuffle([ans + step, ans - step, ans + 2 * step, ans - 2 * step, ans + 1, ans - 1, ans + 10, ans - 10, ans * 2, ans / 2, ans + 3 * step]);
  for (const v of pool) { if (out.length >= 3) break; add(v); }
  let k = 4; while (out.length < 3) add(ans + k++ * step);
  return out.slice(0, 3);
}

/* ---------- Saved state ---------- */
const STORE = 'polymath-arcade-v1';
function freshState() {
  return { v: 1, name: 'Player', xp: 0, sound: true, theme: null, streak: 0, bestStreak: 0, lastDay: null,
    goal: { day: null, rounds: 0 }, daily: {}, games: {}, domains: {}, badges: {},
    stats: { rounds: 0, correct: 0, answered: 0, bestCombo: 0 }, robot: { unlocked: 1, stars: {} }, tour: 0, haptics: true, updated: 0 };
}
function normalize(o) {
  const s = freshState();
  if (o && typeof o === 'object') {
    for (const k in s) if (o[k] !== undefined && o[k] !== null) s[k] = o[k];
    s.goal = Object.assign(freshState().goal, s.goal);
    s.stats = Object.assign(freshState().stats, s.stats);
    s.robot = Object.assign(freshState().robot, s.robot);
    if (o.theme === null) s.theme = null;

}

function gameRec(id) { if (!S.games[id]) S.games[id] = { plays: 0, best: 0, stars: 0, diff: 1 }; return S.games[id]; }

/* Optional sync to the viewer's private store when the page runs inside Claude. Falls back silently. */
const Cloud = {
  ref: null, on: false, busy: false, again: false, timer: 0, retries: 0,
  async init() {
    try {

      if (!db || !user) return;

      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/progress');

const FX = {
  parts: [], running: false, cv: null, c: null, dpr: 1,
  ensure() {
    if (!this.cv) { this.cv = $('#fx'); this.c = this.cv.getContext('2d'); }
    const d = Math.min(2, window.devicePixelRatio || 1), w = Math.round(innerWidth * d), hh = Math.round(innerHeight * d);

  burst(n = 170) {

    const cols = this.palette();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.9, sp = 7 + Math.random() * 11;
      this.parts.push({ k: Math.random() < 0.82 ? 'conf' : 'star', x: innerWidth / 2 + (Math.random() - 0.5) * 180, y: innerHeight * 0.38, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 6 + Math.random() * 7, h: 3 + Math.random() * 4, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.35, flip: Math.random() * 6.3, vf: 0.1 + Math.random() * 0.22, c: cols[i % cols.length], life: 1, decay: 0.0035 + Math.random() * 0.004 });
    }

  },
  burstAt(x, y, color, n = 28) {
    if (reduceMotion()) return;

  fade() { for (const p of this.parts) p.decay = Math.max(p.decay, 0.07); },

          p.vy += 0.26; p.vx *= 0.99; p.vy *= 0.993; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.flip += p.vf;
          c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(1, Math.cos(p.flip)); c.fillStyle = p.c;

          c.restore();
        } else if (p.k === 'spark') {
          p.vy += 0.12; p.x += p.vx; p.y += p.vy; p.vx *= 0.96;
          c.fillStyle = p.c; c.shadowColor = p.c; c.shadowBlur = 12;
          c.beginPath(); c.arc(p.x, p.y, Math.max(0.3, p.r * p.life), 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;

          p.r += p.vr; p.vr *= 0.93;

    };

  }
};

  const rect = ev && ev.currentTarget && ev.currentTarget.getBoundingClientRect ? ev.currentTarget.getBoundingClientRect() : null;

    frames: 0, acc: 0, P: null, aspect: 1, sk: 1, calm: [1, 0.5, 0.4],
    init() {

/* =====================================================================

})();

   Brain + Math: Memory Matrix, Color Clash, Pattern Pro, Math Sprint, Target Number
   ===================================================================== */

/* ---------- Memory Matrix ---------- */
IMPL.memory = {
  play(ctx) {
    const r = ctx.r, MAXT = 12;
    let n = 3 + Math.floor((ctx.diff - 1) / 2), lives = 3, trial = 0, wins = 0, score = 0, maxN = 0, phase = 'wait';
    let targets = new Set(), found = new Set(), cells = [];
    const status = h('p', { class: 'prompt', 'aria-live': 'polite' }, 'Get ready…');
    const grid = h('div', { class: 'mm-grid locked' });
    ctx.body.append(h('div', { class: 'stack' }, status, h('div', { class: 'mm-stage' }, grid)));
    const hudAll = () => {
      ctx.hud('score', 'Score', fmt(score));
      ctx.hud('lives', 'Lives', '♥'.repeat(lives) + '♡'.repeat(3 - lives));
      ctx.hud('round', 'Round', `${Math.max(1, Math.min(trial, MAXT))}/${MAXT}`);
    };
    function startTrial() {
      if (lives <= 0 || trial >= MAXT) return end();
      trial++; hudAll();
      const size = n <= 4 ? 3 : n <= 6 ? 4 : n <= 9 ? 5 : 6;
      targets = new Set(r.sample([...Array(size * size).keys()], n)); found = new Set();
      grid.innerHTML = ''; grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`; grid.classList.add('locked');
      cells = [...Array(size * size)].map((_, i) => { const c = h('button', { class: 'mm-cell', type: 'button', 'aria-label': `Tile ${i + 1}`, onclick: () => tap(i) }, h('span', { class: 'mm-flip' }, h('span', { class: 'mm-f front' }), h('span', { class: 'mm-f back' }))); grid.append(c); return c; });
      phase = 'show';
      status.innerHTML = `Memorize <b>${n}</b> tiles`;
      ctx.timeout(() => targets.forEach(i => cells[i].classList.add('lit')), 450);
      ctx.timeout(() => {
        targets.forEach(i => cells[i].classList.remove('lit'));
        phase = 'input'; grid.classList.remove('locked');
        status.innerHTML = `Your turn: tap the <b>${n}</b> tiles`;
      }, 450 + 900 + n * 170);
    }
    function tap(i) {
      if (phase !== 'input' || found.has(i) || ctx.done) return;
      if (targets.has(i)) {
        found.add(i); cells[i].classList.add('hit'); SFX.pop(); score += 10;
        if (found.size === targets.size) {
          phase = 'wait'; wins++; maxN = Math.max(maxN, n); score += n * 15; SFX.good(); burstFrom(grid, cssVar('--good'), 36);
          status.innerHTML = '<b>Perfect!</b> One more tile next round.';
          n = Math.min(n + 1, 14); grid.classList.add('locked');
          ctx.timeout(startTrial, 850);
        }
      } else {
        cells[i].classList.add('miss'); lives--; phase = 'wait'; SFX.bad(); buzz(); grid.classList.add('locked');
        targets.forEach(t => { if (!found.has(t)) cells[t].classList.add('reveal'); });
        status.innerHTML = lives ? `<b>Missed.</b> Dashed tiles show what you missed. ${lives} ${lives === 1 ? 'life' : 'lives'} left.` : '<b>Out of lives.</b>';
        n = Math.max(3, n - 1);
        ctx.timeout(startTrial, 1600);
      }
      hudAll();
    }
    function end() {
      const stars = wins >= 9 ? 3 : wins >= 6 ? 2 : wins >= 3 ? 1 : 0;
      ctx.finish({
        score, stars, perf: wins / MAXT, badges: maxN >= 10 ? ['memory'] : [],
        summary: [['Perfect rounds', `${wins}/${trial}`], ['Biggest pattern', maxN ? `${maxN} tiles` : '–'], ['Lives left', String(lives)]],
        lesson: 'Working memory holds only a few items at once. Seeing the tiles as shapes or lines (chunking) lets you hold far more than remembering single squares.'
      });
    }
    hudAll();
    ctx.timeout(startTrial, 350);
  }

function maxTier(d) { return d <= 3 ? 1 : d <= 6 ? 2 : 3; }
function pickTiered(list, d, r, tierOf = x => x.t) {
  const top = maxTier(d);
  const exact = list.filter(x => tierOf(x) === top);
  if (exact.length && r.chance(0.6)) return r.pick(exact);
  return r.pick(list.filter(x => tierOf(x) <= top));
}

    const cash = clamp(0.03 + n.c, 0.002, 0.08);
    return {
      n, cash,
      ret: [clamp(r.normal(0.09 + n.s, 0.16), -0.5, 0.8), clamp(r.normal(0.04 + n.b, 0.06), -0.25, 0.3), cash, clamp(r.normal(0.10 + n.k, 0.6), -0.85, 3)],

  });
}

const TY_WEATHER = [
  { name: 'Scorching', temp: '35 °C / 95 °F', traffic: 1.35, mu: 2.6 },
  { name: 'Sunny', temp: '28 °C / 82 °F', traffic: 1.15, mu: 2.2 },
  { name: 'Cloudy', temp: '21 °C / 70 °F', traffic: 0.85, mu: 1.8 },
  { name: 'Rainy', temp: '16 °C / 61 °F', traffic: 0.45, mu: 1.4 }

const TY_EVENTS = [
  { name: 'Street festival nearby', note: 'Big crowds expected.', traffic: 1.7, mu: 0 },
  { name: 'A competitor opened across the street', note: 'Shoppers have another option.', traffic: 1, mu: -0.35 },
  { name: 'A local influencer posted about you', note: 'Curious new customers are coming.', traffic: 1.35, mu: 0.1 },
  { name: 'Road work blocks the sidewalk', note: 'Fewer people walking by.', traffic: 0.6, mu: 0 },
  { name: 'School is out for summer', note: 'Families everywhere, on a budget.', traffic: 1.3, mu: -0.1 }

const TY = { cost: 0.45, rent: 8, base: 110, sd: 0.7, days: 7, start: 50, stars: [0.3, 0.55, 0.75], mogul: 0.82 };
function tyPlan(r) {

}

  if (snap && ['home', 'daily', 'profile'].includes(snap.view)) VIEW = snap.view;
  else if (App.hashView()) VIEW = App.hashView();
  if (snap && (snap.filter === 'all' || DOMAINS[snap.filter])) FILTER = snap.filter;
  render();
  try { window.claude?.hot?.snapshot?.(() => ({ view: VIEW, filter: FILTER })); } catch (e) { /* not in viewer */ }
  Cloud.init();
  const wait = App.init();
  if (location.hash === '#tour') setTimeout(() => Tour.start(), wait + 300);
  else if (!S.tour && !S.stats.rounds && !(snap && snap.view)) setTimeout(() => { if (!CUR && $('#modal').hidden && !S.tour && !S.stats.rounds) Tour.start({ auto: true }); }, wait + 1100);
}
const start = snap => boot(snap || {});
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});

</script>
</body>
